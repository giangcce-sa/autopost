services:
  trendos:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TRENDOS_DATABASE_URL: sqlite:///data/trendos.db
      OUTPUT_DIR: /app/trendos_output
    volumes:
      - ./trendos_data:/app/data
      - ./trendos_output:/app/trendos_output
    command: uvicorn trendos.api.app:app --host 0.0.0.0 --port 8000
