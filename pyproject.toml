[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendos"
version = "0.1.0"
description = "Hệ điều hành phát hiện xu hướng và sản xuất nội dung tự động"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Phụ thuộc theo từng nguồn — cài khi triển khai collector tương ứng.
sources = [
    "feedparser>=6.0",      # RSS collector
    "pytrends>=4.9",        # Google Trends (không official)
    "praw>=7.7",            # Reddit
    "google-api-python-client>=2.0",  # YouTube Data API
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
trendos = "trendos.cli:main"

[tool.setuptools.packages.find]
include = ["trendos*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query trong default là idiom chuẩn của FastAPI, không phải bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
